<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Mein PS4 Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0b0e14; color: #fff; padding: 25px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #0070d1; }
    h1 { font-size: 28px; color: #0070d1; letter-spacing: 2px; }
    .controls { display: flex; gap: 15px; margin-bottom: 20px; }
    input { padding: 12px; border-radius: 6px; border: 1px solid #2a2e39; background: #161a23; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #0070d1; box-shadow: 0 0 10px rgba(0, 112, 209, 0.5); }
    #search { flex-grow: 1; }
    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .game-card { background: #161a23; border-radius: 12px; overflow: hidden; border: 2px solid transparent; display: flex; flex-direction: column; }
    .game-card:hover, .game-card:focus-within { border-color: #0070d1; transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0, 112, 209, 0.4); }
    .cover-img { width: 100%; height: 260px; object-fit: cover; background: #222; }
    .card-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .game-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
    .game-meta { font-size: 13px; color: #8a8f9d; margin-bottom: 15px; }
    button { background: #0070d1; color: white; border: none; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; width: 100%; }
    button:hover, button:focus { background: #005bb5; outline: 2px solid #fff; }
  </style>
</head>
<body>

  <header>
    <h1>PS4 STORE</h1>
    <input type="text" id="ps4ip" value="127.0.0.1" placeholder="PS4 IP-Adresse" style="width: 160px;">
  </header>

  <div class="controls">
    <input type="text" id="search" placeholder="Spiel oder Kategorie suchen..." onkeyup="searchGames()">
  </div>

  <div class="game-grid" id="game-list">Wird geladen...</div>

  <script>
    let allGames = [];

    fetch('games.json')
      .then(res => res.json())
      .then(data => {
        allGames = data;
        displayGames(allGames);
      });

    function displayGames(games) {
      const container = document.getElementById('game-list');
      container.innerHTML = '';
      
      games.forEach((game, index) => {
        const cover = game.cover || 'https://via.placeholder.com/200x260/161a23/8a8f9d?text=Kein+Bild';
        container.innerHTML += `
          <div class="game-card">
            <img src="${cover}" class="cover-img" alt="${game.title}">
            <div class="card-info">
              <div>
                <div class="game-title">${game.title}</div>
                <div class="game-meta">${game.category || 'Game'} • ${game.size || 'PKG'}</div>
              </div>
              <button id="btn-${index}" onclick="downloadToPs4('${game.pkg_url}')">Herunterladen</button>
            </div>
          </div>
        `;
      });
    }

    function searchGames() {
      const query = document.getElementById('search').value.toLowerCase();
      const filtered = allGames.filter(g => 
        g.title.toLowerCase().includes(query) || 
        (g.category && g.category.toLowerCase().includes(query))
      );
      displayGames(filtered);
    }

    function downloadToPs4(pkgUrl) {
      const ip = document.getElementById('ps4ip').value;
      fetch(`http://${ip}:12800/api/install`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: "direct",
          packages: [ pkgUrl ]
        })
      })
      .then(() => alert("Download gestartet! Guck in deine PS4-Mitteilungen."))
      .catch(err => alert("Fehler: PS4 nicht erreichbar. Läuft GoldHEN?"));
    }

    // PS4 Controller Unterstützung (X-Taste)
    window.addEventListener("gamepadconnected", () => {
      setInterval(pollGamepad, 150);
    });

    function pollGamepad() {
      const gamepads = navigator.getGamepads();
      if (!gamepads[0]) return;
      if (gamepads[0].buttons[0].pressed && document.activeElement) {
        document.activeElement.click();
      }
    }
  </script>
</body>
</html>
